<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XtaxRich GitHub profile cover</title>
  <style>
    @font-face {
      font-family: "Space Grotesk";
      src: url("space-grotesk.woff2") format("woff2");
      font-weight: 400 700;
      font-display: block;
    }

    :root {
      color-scheme: light dark;
      --paper: #f7f4ed;
      --panel: #fffdf9;
      --ink: #20241f;
      --muted: #54584e;
      --border: #dcd6cb;
      --rule: #c8cfc4;
      --grid: #827e7118;
      --accent: #a6371c;
      --accent-panel: #fbe7dd;
      --shadow: #3f302210;
      --mono: ui-monospace, "SF Mono", monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #171b18;
        --panel: #202620;
        --ink: #f4f4eb;
        --muted: #bec5b7;
        --border: #424a40;
        --rule: #637061;
        --grid: #dbe3ca17;
        --accent: #ff9b80;
        --accent-panel: #4d2d25;
        --shadow: #0004;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: "Space Grotesk", sans-serif; }
    h1, h2, p, ol { margin: 0; }
    .cover {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: minmax(0, .86fr) minmax(0, 1.14fr);
      align-items: center;
      gap: 38px;
      width: 1280px;
      height: 296px;
      overflow: hidden;
      padding: 34px 42px;
      border: 2px solid var(--border);
      border-radius: 22px;
      background: var(--paper);
      color: var(--ink);
    }

    .cover::before {
      position: absolute;
      z-index: -1;
      inset: 0 0 0 41%;
      content: "";
      background: radial-gradient(circle, var(--grid) 1.4px, transparent 1.6px) 0 0 / 15px 15px;
      mask-image: linear-gradient(90deg, transparent, #000 34%);
    }

    .role {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--accent);
      font: 600 20px/1.3 var(--mono);
      letter-spacing: .065em;
      text-transform: uppercase;
    }

    .role::before {
      width: 12px;
      height: 12px;
      border: 3px solid currentColor;
      border-radius: 3px;
      content: "";
      transform: rotate(45deg);
    }

    h1 { font-size: 106px; font-weight: 700; line-height: .97; letter-spacing: -.087em; }
    h1 span { color: var(--accent); }
    .topics { margin-top: 13px; color: var(--muted); font-size: 27px; line-height: 1.3; letter-spacing: -.023em; }

    .trace {
      padding: 21px 25px 22px;
      border: 1.5px solid var(--border);
      border-radius: 15px;
      background: var(--panel);
      box-shadow: 0 8px 23px var(--shadow);
    }

    .trace-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .trace-heading h2 { font-size: 29px; line-height: 1; letter-spacing: -.048em; }
    .trace-heading p { color: var(--muted); font: 500 15px/1.3 var(--mono); white-space: nowrap; }
    .steps { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 24px; padding: 0; list-style: none; text-align: center; }
    .steps::before { position: absolute; inset: 22px 16.66% auto; border-top: 2px solid var(--rule); content: ""; }
    .step { position: relative; padding-inline: 5px; }

    .symbol {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      margin: 0 auto 9px;
      border: 2px solid var(--rule);
      border-radius: 50%;
      background: var(--panel);
      color: var(--ink);
      font: 600 24px/1 var(--mono);
    }

    .step:first-child .symbol { border-color: var(--accent); background: var(--accent-panel); color: var(--accent); }
    .step strong { display: block; font-size: 22px; line-height: 1.15; letter-spacing: -.036em; }
    .step small { display: block; margin-top: 3px; color: var(--muted); font-size: 17px; line-height: 1.2; }

    @media (max-width: 720px) {
      .cover {
        grid-template-columns: 1fr;
        align-content: center;
        gap: 15px;
        width: 720px;
        height: 328px;
        padding: 24px 28px;
      }

      .role { margin-bottom: 5px; font-size: 21px; }
      h1 { font-size: 72px; }
      .topics { margin-top: 5px; font-size: 25px; }
      .trace { padding: 14px 20px 15px; }
      .trace-heading h2 { font-size: 25px; }
      .steps { margin-top: 12px; }
      .steps::before { top: 18px; }
      .symbol { width: 38px; height: 38px; margin-bottom: 5px; font-size: 22px; }
      .step strong { font-size: 22px; }
      .step small { display: none; }
    }
  </style>
</head>
<body>
  <main class="cover">
    <div>
      <p class="role">AI Product Manager</p>
      <h1>XtaxRich<span>.</span></h1>
      <p class="topics">Agent workflows · Evals · Economics</p>
    </div>
    <section class="trace" aria-labelledby="trace-title">
      <header class="trace-heading">
        <h2 id="trace-title">Trace replay</h2>
        <p>Eval Platform · V2</p>
      </header>
      <ol class="steps">
        <li class="step"><span class="symbol" aria-hidden="true">!</span><strong>Timeout</strong><small>Write result unknown</small></li>
        <li class="step"><span class="symbol" aria-hidden="true">↻</span><strong>Look up</strong><small>Check original key</small></li>
        <li class="step"><span class="symbol" aria-hidden="true">✓</span><strong>Confirm</strong><small>Reply with receipt</small></li>
      </ol>
    </section>
  </main>
</body>
</html>
